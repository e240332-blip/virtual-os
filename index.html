

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual OS</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  font-family: "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #7ca9e8, #e9b7d8);
  color: white;
}

/* デスクトップ */
.desktop {
  height: 100vh;
  padding: 20px;
  background:
    linear-gradient(#0001, #0001),
    linear-gradient(135deg, #79a9e8, #e8b5d5);
}

/* アイコン */
.icons {
  display: flex;
  flex-direction: column;
  gap: 25px;
  width: 100px;
}

.icon {
  width: 85px;
  padding: 12px 5px;
  text-align: center;
  cursor: pointer;
  border-radius: 8px;
  user-select: none;
}

.icon:hover {
  background: #ffffff33;
}

.icon .emoji {
  font-size: 38px;
  display: block;
  margin-bottom: 8px;
}

.icon span:last-child {
  font-size: 14px;
}

/* タスクバー */
.taskbar {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 48px;
  background: #ffffffdd;
  color: #333;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  backdrop-filter: blur(10px);
}

.clock {
  text-align: right;
  font-size: 13px;
}

/* アプリウィンドウ */
.window {
  position: absolute;
  top: 100px;
  left: 180px;
  width: 500px;
  height: 350px;
  background: white;
  color: #333;
  border-radius: 10px;
  box-shadow: 0 10px 35px #0004;
  overflow: hidden;
}

.window-header {
  height: 40px;
  background: #e8e8e8;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 12px;
  cursor: move;
}

.window-header button {
  border: none;
  background: transparent;
  font-size: 18px;
  cursor: pointer;
}

.window-content {
  padding: 20px;
}
</style>
</head>

<body>

<div class="desktop">
  <div class="icons">

    <div class="icon" onclick="openApp('メール')">
      <span class="emoji">📩</span>
      <span>メール</span>
    </div>

    <div class="icon" onclick="openApp('メモ帳')">
      <span class="emoji">📝</span>
      <span>メモ帳</span>
    </div>

    <div class="icon" onclick="openApp('調査記録')">
      <span class="emoji">📚</span>
      <span>調査記録</span>
    </div>

    <div class="icon" onclick="openApp('ブラウザ')">
      <span class="emoji">🌐</span>
      <span>ブラウザ</span>
    </div>

  </div>
</div>

<div class="taskbar">
  <div>⏻</div>
  <div>Virtual OS</div>
  <div class="clock" id="clock"></div>
</div>

<script>
function openApp(name) {
  const win = document.createElement("div");
  win.className = "window";

  win.innerHTML = `
    <div class="window-header">
      <span>${name}</span>
      <button onclick="this.closest('.window').remove()">×</button>
    </div>
    <div class="window-content">
      <h2>${name}</h2>
      <p>${name}アプリを起動しました。</p>
    </div>
  `;

  document.body.appendChild(win);
}

function updateClock() {
  const now = new Date();

  document.getElementById("clock").innerHTML =
    now.toLocaleTimeString("ja-JP", {
      hour: "2-digit",
      minute: "2-digit"
    }) + "<br>" +
    now.toLocaleDateString("ja-JP");
}

updateClock();
setInterval(updateClock, 1000);
</script>

</body>
</html>
